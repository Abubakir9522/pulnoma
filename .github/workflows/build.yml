name: APK yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imzo kalitini tayyorlash
        env:
          KS_B64: ${{ secrets.PULNOMA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pulnoma.jks"
            echo "PULNOMA_KEYSTORE=$RUNNER_TEMP/pulnoma.jks" >> "$GITHUB_ENV"
          fi

      - name: APK yig'ish
        env:
          PULNOMA_KEY_PASSWORD: ${{ secrets.PULNOMA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/release/app-release.apk Pulnoma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pulnoma-APK
          path: Pulnoma.apk

      - name: Releases bo'limiga joylash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Pulnoma.apk --title "Pulnoma — oxirgi versiya" --notes "Telefonga o'rnatish uchun Pulnoma.apk faylini yuklab oling." --latest

      - name: APK'ni apk shoxchasiga saqlash
        run: |
          mkdir -p "$RUNNER_TEMP/apkb" && cp Pulnoma.apk "$RUNNER_TEMP/apkb/"
          cd "$RUNNER_TEMP/apkb"
          git init -q -b apk
          git -c user.name=github-actions -c user.email=actions@github.com add Pulnoma.apk
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
