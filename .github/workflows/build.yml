name: APK yig'ish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imzo kalitini tayyorlash
        env:
          KS_B64: ${{ secrets.PULNOMA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pulnoma.jks"
            echo "PULNOMA_KEYSTORE=$RUNNER_TEMP/pulnoma.jks" >> "$GITHUB_ENV"
          fi

      - name: APK yig'ish
        env:
          PULNOMA_KEY_PASSWORD: ${{ secrets.PULNOMA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/release/app-release.apk Pulnoma-1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pulnoma-APK
          path: Pulnoma-1.0.apk
